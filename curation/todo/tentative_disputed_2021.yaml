  latex_body: \citet{Marcelino:2020:L6} report a tentative detection of \ce{HC5NH+} in Yebes 40-m observations of TMC-1.  They identify a series of eight harmonically spaced lines in the data corresponding to a rotational constant $B$ = 1295.8158\,MHz.  Based on quantum chemical calculations, they suggest either \ce{HC5NH+} or \ce{NC4NH+} as the potential carrier, eventually proposing \ce{HC5NH+} as the more likely.  The lack of laboratory frequencies for confirmation is the remaining hinderance.
