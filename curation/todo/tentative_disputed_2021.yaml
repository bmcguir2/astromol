- kind: molecule
  label: mol:NH2CH2COOH
  name: glycine
  formula: NH2CH2COOH
  refs:
    lab:
    - Suenram:1980:7180
    - Lovas:1995:L201
    - Ilyushin:2005:15
    computation: []
  latex_body: \citet{Kuan:2003:848} reported a detection of 27 lines of \ce{NH2CH2COOH} in observations toward Orion, Sgr B2, and W51 using the NRAO 12-m telescope.  Each source contained 13--16 of the 27 features; three features were seen in common between the sources.  The frequencies were obtained from the rotational constants measured and reported in \citet{Suenram:1980:7180} and \citet{Lovas:1995:L201}.  The detection was later disputed by \citet{Snyder:2005:914}, who claimed to have identified a number of issues with the analysis.  Notably, \citet{Snyder:2005:914} argue that the frequency predictions used by \citet{Kuan:2003:848} were extrapolated too far above the measured laboratory transitions.  \citet{Snyder:2005:914} used laboratory frequencies from \citet{Ilyushin:2005:15} that covered the observed frequency range, and examined archival NRAO 12-m and SEST 15-m observations of Orion, Sgr B2, and W51.  They report a number of ``missing'' transitions of \ce{NH2CH2COOH} that they
    predicted should have been strongly detected, if the detection of \citet{Kuan:2003:848} held.  Subsequent searches by \citet{Jones:2007:579}, \citet{Cunningham:2007:1201}, and \citet{Belloche:2008:179} using both interferometers and single-dish facilities failed to detect \ce{NH2CH2COOH}, and set upper limits to the column density lower than that claimed in the detection of \citet{Kuan:2003:848} (see \citealt{Belloche:2008:179} \S4.4 for a detailed discussion).
- kind: detection
