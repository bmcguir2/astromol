# Copy this block into curation/staging/<name>.yaml and fill it in.
# Required fields: kind, name, nick, type.
# Optional fields can be left blank; stage_records.py prunes empty template
# sections and fills production defaults.

- kind: source  # REQUIRED
  name: Example Source  # REQUIRED; string
  nick: ExampleSource  # REQUIRED; unique string key used by detections
  type: Other  # REQUIRED; source type from SOURCE_TYPES
  ra:  # string; quote sexagesimal values, e.g. "18:53:18.5"
  dec:  # string; quote signed sexagesimal values, e.g. "+01:14:59"
  simbad_url:  # string URL
  latex_name:  # string used for generated LaTeX
  note:  # string
