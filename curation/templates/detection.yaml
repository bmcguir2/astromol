# Copy this block into curation/staging/<name>.yaml and fill it in.
# Required fields: kind, id, molecule, year, type.
# Optional fields can be left blank; stage_records.py prunes empty template
# sections and fills production defaults.

- kind: detection  # REQUIRED
  operation: add  # staging-only; use update for a generated existing-record template
  id: det:EXAMPLE:ism-csm:2026  # REQUIRED; stable unique detection ID
  molecule: mol:EXAMPLE  # REQUIRED
  sources: []
  telescopes: []
  wavelengths: []
  year: 2026  # REQUIRED
  type: ISM/CSM  # REQUIRED
  status: secure
  status_note:
  note:
  first: false
  month:
  day:
  refs:
    observation: []
    confirmation: []
    dispute: []
    correction: []
  confirms: []
  confirmed_by: []
  disputes: []
  disputed_by: []
  supersedes: []
  superseded_by: []
  latex_text:
  # Optional. Leave blank to let stage_records.py populate a standard
  # history block. Secure detections default to current-census accepted
  # membership; tentative/disputed detections default to accepted: null.
  history:
    introduced:
      date:
      census:
      context:
    accepted:
      date:
      census:
      context:
    last_modified:
    events: []

  # Staging-only fields. These are reported but not written to JSON.
  _raw_sources_not_mapped: []
  _raw_telescopes_not_mapped: []
  _curation_note:
