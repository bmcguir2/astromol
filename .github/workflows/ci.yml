name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-test-docs:
    name: Validate, test, and build docs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with development and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      - name: Prepare Matplotlib cache
        run: mkdir -p "$MPLCONFIGDIR"

      - name: Validate production data
        run: astromol-validate

      - name: Run tests
        run: python -m pytest

      - name: Build documentation
        run: python -m sphinx -W -b html docs docs/_build/html
