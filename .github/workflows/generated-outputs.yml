name: Generated Outputs

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Finish an active publish before replacing it with a newer run.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    name: Generate figures, slides, and tables
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      - name: Prepare Matplotlib cache
        run: mkdir -p "$MPLCONFIGDIR"

      - name: Validate production data
        run: astromol-validate

      - name: Run tests
        run: python -m pytest

      - name: Build documentation
        run: python -m sphinx -W -b html docs docs/_build/html

      - name: Generate standard outputs
        run: |
          python scripts/generate_outputs.py \
            --output-dir build/astromol_outputs \
            --view current \
            --formats png pdf

      - name: Upload generated outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: astromol-latest-generated-outputs
          path: build/astromol_outputs
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/astromol_outputs

  deploy-pages:
    name: Deploy latest outputs to GitHub Pages
    needs: generate
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/refactor'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
